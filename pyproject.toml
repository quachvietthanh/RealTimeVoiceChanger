[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-voice-changer"
version = "0.1.0"
description = "A real-time male-to-female voice changer for Windows using RVC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Project Maintainers" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

# Runtime dependencies match the verified Milestone 1-3A.1 stack (docs/rvc-engine-specification.md).
# torch/torchaudio must be installed from the CUDA 12.1 index first:
#   pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cu121
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy>=1.23,<2.0",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "faiss-cpu>=1.7.4",
    "sounddevice>=0.4.6",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyright>=1.1.350"
]

[project.scripts]
voice-changer = "voice_changer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["third_party"]
venvPath = "."
venv = ".venv"
extraPaths = [
    "src",
    "third_party/applio"
]
